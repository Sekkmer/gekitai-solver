[package]
name = "gekitai-solver"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Gekitai solver, strategy certificate checker, and browser player"
repository = "https://github.com/Sekkmer/gekitai-solver"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
parking_lot = "0.12"
hashbrown = "0.14"
ahash = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
zstd = "0.13"
ctrlc = "3.4"
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
once_cell = "1.19"
num_cpus = "1.16"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
