name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --test browser_reference -- --ignored
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser and animation tests under a project subpath
        run: |
          mkdir -p /tmp/gekitai-site/gekitai-solver
          cp -R web/. /tmp/gekitai-site/gekitai-solver/
          python3 -m http.server 8769 --bind 127.0.0.1 --directory /tmp/gekitai-site > /tmp/gekitai-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8769/gekitai-solver/ > /dev/null; then break; fi
            sleep 1
          done
          node test/browser/static.cjs http://127.0.0.1:8769/gekitai-solver/
          node test/browser/motion.cjs http://127.0.0.1:8769/gekitai-solver/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v5
        id: deployment
